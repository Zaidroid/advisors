<script>

  theme: {

}

<style>
  :root{
    --brand-primary:#DE6336;
    --brand-secondary:#309DC4;
    --brand-dark:#1F3036;
    --brand-accent:#E78B3F;
    --surface-soft:#FAFAF7;
    --surface-muted:#F1F1EC;
    --surface-border:#E6E6DF;
  }
  html,body{background:#FAFAF7;color:var(--brand-dark);font-family:"Source Sans 3","Tajawal",sans-serif;}
  body{font-feature-settings:"ss01","ss02";}
  .grid_bg{
    background-image:
      linear-gradient(var(--surface-border) 1px, transparent 1px),
      linear-gradient(90deg, var(--surface-border) 1px, transparent 1px);
    background-size: 48px 48px;
    background-position: -1px -1px;
    opacity:.35;
  }
  .ring_brand{box-shadow:0 0 0 3px rgba(222,99,54,.15);}
  .seg_btn{transition:all .15s ease;}
  .pill{border-radius:999px;}
  .fade_in{animation:fadeIn .2s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
  .scroll_slim::-webkit-scrollbar{width:8px;height:8px;}
  .scroll_slim::-webkit-scrollbar-thumb{background:#D6D6CC;border-radius:8px;}
  .scroll_slim::-webkit-scrollbar-track{background:transparent;}
  .no_select{user-select:none;}
  [dir="rtl"] body{font-family:"Tajawal","Source Sans 3",sans-serif;}
  .avatar{
    background: radial-gradient(circle at 30% 25%, #F4D6C9 0%, #E9B79E 55%, #DE6336 100%);
  }
  .badge{
    display:inline-flex;align-items:center;gap:6px;
    padding:2px 10px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.02em;
  }
  .kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;background:#F1F1EC;border:1px solid #E6E6DF;padding:2px 6px;border-radius:4px;}
  .tabular{font-variant-numeric:tabular-nums;}
  .divider{height:1px;background:var(--surface-border);}
  .link_teal{color:var(--brand-secondary);}
  .link_teal:hover{text-decoration:underline;}
  details > summary{list-style:none;cursor:pointer;}
  details > summary::-webkit-details-marker{display:none;}
  input[type="date"]{font-family:inherit;}
  .focus_ring:focus{outline:none;box-shadow:0 0 0 3px rgba(48,157,196,.25);}
  .stale_tag{background:#FEF3EB;color:#B45309;border:1px solid #FED7AA;}
  .ok_tag{background:#ECFDF5;color:#065F46;border:1px solid #A7F3D0;}
  .progress_bar{height:6px;background:#EDEDE5;border-radius:999px;overflow:hidden;}
  .progress_fill{height:100%;transition:width .3s ease;}
  .chip_clickable{cursor:pointer;transition:all .12s;}
  .chip_clickable:hover{transform:translateY(-1px);}
  .section_title{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6B706E;}
  .stat_num{font-size:28px;font-weight:700;color:var(--brand-dark);line-height:1;}
  .stat_label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#6B706E;font-weight:600;}
  .card_hover:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(31,48,54,.08);}
  .card_hover{transition:transform .18s ease, box-shadow .18s ease;}
  .modal_backdrop{background:rgba(31,48,54,.6);backdrop-filter:blur(4px);}
  .score_ring{transform:rotate(-90deg);}
  .score_ring_track{stroke:#EDEDE5;}
  .score_ring_fill{transition:stroke-dashoffset .5s ease;}
  .primary_btn{background:var(--brand-primary);color:#fff;padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;}
  .primary_btn:hover{background:#C9552A;}
  .secondary_btn{background:#fff;color:var(--brand-dark);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;border:1px solid var(--surface-border);}
  .secondary_btn:hover{background:var(--surface-soft);}
  .tiny_btn{padding:6px 10px;border-radius:6px;font-size:12px;font-weight:600;border:1px solid var(--surface-border);background:#fff;}
  .tiny_btn:hover{background:var(--surface-soft);}
  .danger_btn{background:#fff;color:#B91C1C;border:1px solid #FECACA;}
  .danger_btn:hover{background:#FEF2F2;}
  .status_dot{width:8px;height:8px;border-radius:999px;display:inline-block;}
</style>
</head>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback, useRef, Fragment } = React;

// ---------- constants ----------

const TEAM = [
  "Zaid Salem",
  "Mohammed Ayesh",
  "Israa Hamoudeh",
  "Haneen Bader",
  "Hazem Kiwan",
  "Rand Safi",
  "Doaa",
  "Muna",
  "Raouf",
  "Laith",
];

const STATUSES = [
  { key: "new",           label: "New",                 tone: "#6B706E" },
  { key: "acknowledged",  label: "Acknowledged",        tone: "#309DC4" },
  { key: "allocated",     label: "Allocated",           tone: "#309DC4" },
  { key: "intro_sched",   label: "Intro call scheduled",tone: "#E78B3F" },
  { key: "intro_done",    label: "Intro call done",     tone: "#E78B3F" },
  { key: "assessment",    label: "Assessment",          tone: "#DE6336" },
  { key: "approved",      label: "Approved",            tone: "#065F46" },
  { key: "rejected",      label: "Rejected",            tone: "#B91C1C" },
  { key: "matched",       label: "Matched to company",  tone: "#065F46" },
  { key: "on_hold",       label: "On hold",             tone: "#6B706E" },
];
const STATUS_MAP = Object.fromEntries(STATUSES.map(s => [s.key, s]));

const CATEGORIES = [
  { key: "CEO", label: "CEO", blurb: "Strategy, leadership, board readiness" },
  { key: "CTO", label: "CTO", blurb: "Technical architecture, engineering leadership" },
  { key: "COO", label: "COO", blurb: "Operations, finance, HR, legal, process" },
];

const STALE_DAYS = 14; // flag anything idle longer than this
const LS_KEY = "gsg_elevate_tracker_v1";

// ---------- helpers ----------

const todayISO = () => new Date().toISOString().slice(0, 10);
const daysBetween = (aISO, bISO) => {
  if (!aISO || !bISO) return 0;
  const ms = new Date(bISO).getTime() - new Date(aISO).getTime();
  return Math.floor(ms / 86400000);
};
const fmtDate = (iso) => {
  if (!iso) return "";
  try {
    return new Date(iso).toLocaleDateString("en-GB", { day:"2-digit", month:"short", year:"numeric" });
  } catch { return iso; }
};

const initials = (name) => {
  if (!name) return "?";
  const parts = name.trim().split(/\s+/).filter(Boolean);
  if (parts.length === 0) return "?";
  if (parts.length === 1) return parts[0][0].toUpperCase();
  return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
};

const defaultTrackerFor = (adv) => ({
  status: "new",
  assignee: "",
  receivedAck: false,
  introScheduled: "",
  assessmentDate: "",
  decisionDate: "",
  notes: "",
  lastAction: adv.timestamp ? parseGoogleTs(adv.timestamp) : todayISO(),
  history: [],
});

function parseGoogleTs(ts) {
  // Google Forms timestamp looks like "6/3/2024 15:35:20"
  if (!ts) return todayISO();
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(ts);
  if (!m) return todayISO();
  const [, mm, dd, yyyy] = m;
  return `${yyyy}-${String(mm).padStart(2,"0")}-${String(dd).padStart(2,"0")}`;
}

function exportCSV(rows, filename) {
  const csv = rows.map(r =>
    r.map(v => {
      const s = v == null ? "" : String(v);
      if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
      return s;
    }).join(",")
  ).join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = Object.assign(document.createElement("a"), { href:url, download:filename });
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

// ---------- small UI pieces ----------

function ScoreRing({ value, size=44, stroke=5, color="#DE6336", label }) {
  const r = (size - stroke) / 2;
  const circ = 2 * Math.PI * r;
  const off = circ - (Math.max(0,Math.min(100,value))/100) * circ;
  return (
    <div className="relative inline-flex items-center justify-center" style={{width:size,height:size}}>
      <svg width={size} height={size} className="score_ring">
        <circle cx={size/2} cy={size/2} r={r} fill="none" strokeWidth={stroke} className="score_ring_track" />
        <circle cx={size/2} cy={size/2} r={r} fill="none" strokeWidth={stroke}
                stroke={color} strokeDasharray={circ} strokeDashoffset={off}
                strokeLinecap="round" className="score_ring_fill" />
      </svg>
      <div className="absolute inset-0 flex items-center justify-center">
        <span className="tabular font-bold text-[12px] text-brand-dark">{value}</span>
      </div>
    </div>
  );
}

function StatusBadge({ status }) {
  const s = STATUS_MAP[status] || STATUS_MAP.new;
  return (
    <span className="badge" style={{background:s.tone+"14", color:s.tone, border:`1px solid ${s.tone}33`}}>
      <span className="status_dot" style={{background:s.tone}} />
      {s.label}
    </span>
  );
}

function CategoryPill({ cat, highlighted }) {
  const color = cat === "CEO" ? "#DE6336" : cat === "CTO" ? "#309DC4" : "#E78B3F";
  return (
    <span className="badge" style={{
      background: highlighted ? color : color+"14",
      color: highlighted ? "#fff" : color,
      border: `1px solid ${color}${highlighted ? "" : "33"}`
    }}>
      {cat}
    </span>
  );
}

function StaleFlag({ days }) {
  if (days < STALE_DAYS) return null;
  return <span className="badge stale_tag">Idle {days}d</span>;
}

function App() {
  const raw = useMemo(() => {
    try { return JSON.parse(document.getElementById("advisor_data").textContent); }
    catch { return []; }
  }, []);

  const [tracker, setTracker] = useState(() => {
    try {
      const saved = localStorage.getItem(LS_KEY);
      if (saved) return JSON.parse(saved);
    } catch {}
    const initial = {};
    raw.forEach(a => { initial[a.id] = defaultTrackerFor(a); });
    return initial;
  });

  // ensure new advisors from data get default tracker
  useEffect(() => {
    setTracker(prev => {
      const next = { ...prev };
      let changed = false;
      raw.forEach(a => {
        if (!next[a.id]) { next[a.id] = defaultTrackerFor(a); changed = true; }
      });
      return changed ? next : prev;
    });
  }, [raw]);

  // persist
  useEffect(() => {
    try { localStorage.setItem(LS_KEY, JSON.stringify(tracker)); } catch {}
  }, [tracker]);

  // filters
  const [view, setView]         = useState("dashboard");      // dashboard | pipeline | tracker | alerts
  const [search, setSearch]     = useState("");
  const [stageFilter, setStage] = useState("all");            // all | passed | blocked
  const [catFilter, setCat]     = useState("all");
  const [statusFilter, setSF]   = useState("all");
  const [assigneeFilter, setAF] = useState("all");
  const [openId, setOpenId]     = useState(null);

  const advisors = useMemo(() => raw.map(a => {
    const t = tracker[a.id] || defaultTrackerFor(a);
    const idleDays = daysBetween(t.lastAction || parseGoogleTs(a.timestamp), todayISO());
    return { ...a, tracker: t, idleDays };
  }), [raw, tracker]);

  const filtered = useMemo(() => advisors.filter(a => {
    if (stageFilter === "passed"  && !a.stage1.pass) return false;
    if (stageFilter === "blocked" && a.stage1.pass)  return false;
    if (catFilter !== "all" && a.stage2.primary !== catFilter) return false;
    if (statusFilter !== "all" && a.tracker.status !== statusFilter) return false;
    if (assigneeFilter !== "all" && a.tracker.assignee !== assigneeFilter) return false;
    if (search.trim()) {
      const q = search.trim().toLowerCase();
      const hay = [a.name, a.email, a.position, a.employer, a.country, a.nonTechSubjects, a.techSpecs].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }), [advisors, stageFilter, catFilter, statusFilter, assigneeFilter, search]);

  const stats = useMemo(() => {
    const total = advisors.length;
    const passed = advisors.filter(a => a.stage1.pass).length;
    const byStatus = {};
    STATUSES.forEach(s => byStatus[s.key] = 0);
    advisors.forEach(a => { byStatus[a.tracker.status] = (byStatus[a.tracker.status]||0) + 1; });
    const terminal = ["approved","rejected","matched","on_hold"];
    const unassignedIds = new Set(
      advisors.filter(a => a.stage1.pass && !a.tracker.assignee && !terminal.includes(a.tracker.status)).map(a => a.id)
    );
    const staleIds = new Set(
      advisors.filter(a => a.stage1.pass && a.idleDays >= STALE_DAYS && !terminal.includes(a.tracker.status)).map(a => a.id)
    );
    const ackIds = new Set(
      advisors.filter(a => !a.tracker.receivedAck && a.tracker.status === "new" && a.stage1.pass).map(a => a.id)
    );
    const alertUnion = new Set([...unassignedIds, ...staleIds, ...ackIds]);
    const byCat = { CEO:0, CTO:0, COO:0 };
    advisors.filter(a => a.stage1.pass).forEach(a => { byCat[a.stage2.primary]++; });
    return {
      total, passed, byStatus,
      unassigned: unassignedIds.size,
      stale: staleIds.size,
      awaitingAck: ackIds.size,
      alertCount: alertUnion.size,
      byCat,
    };
  }, [advisors]);

  const updateTracker = useCallback((id, patch, historyLabel) => {
    setTracker(prev => {
      const cur = prev[id] || defaultTrackerFor(raw.find(r => r.id === id));
      const merged = { ...cur, ...patch, lastAction: todayISO() };
      if (historyLabel) {
        merged.history = [...(cur.history || []), { at: todayISO(), label: historyLabel }];
      }
      return { ...prev, [id]: merged };
    });
  }, [raw]);

  const openAdvisor = openId ? advisors.find(a => a.id === openId) : null;

  // CSV export matching what Alan asked for
  const doExport = () => {
    const header = [
      "Advisor ID","Name","Email","WhatsApp","Country","Position","Employer",
      "Years","Non-Tech Subjects","Primary Category","CEO score","CTO score","COO score",
      "Stage 1 total","Stage 1 pass","Status","Assignee","Acknowledged",
      "Intro call","Assessment","Decision","Notes","Days idle","Application date"
    ];
    const rows = [header];
    advisors.forEach(a => {
      rows.push([
        a.id, a.name, a.email, a.whatsapp, a.country, a.position, a.employer,
        a.years, a.nonTechSubjects, a.stage2.primary, a.stage2.ceo, a.stage2.cto, a.stage2.coo,
        a.stage1.total, a.stage1.pass ? "Yes" : "No",
        STATUS_MAP[a.tracker.status]?.label || a.tracker.status,
        a.tracker.assignee, a.tracker.receivedAck ? "Yes" : "No",
        a.tracker.introScheduled, a.tracker.assessmentDate, a.tracker.decisionDate,
        a.tracker.notes, a.idleDays, parseGoogleTs(a.timestamp),
      ]);
    });
    exportCSV(rows, `elevate_advisor_tracker_${todayISO()}.csv`);
  };

  return (
    <div className="min-h-screen">
      <TopBar stats={stats} onExport={doExport} view={view} setView={setView} />

      <div className="max-w-[1440px] mx-auto px-6 pb-24 pt-6">
        {view === "dashboard" && <Dashboard stats={stats} advisors={advisors} onOpenId={setOpenId} setView={setView} setSF={setSF} setStage={setStage} setCat={setCat} />}

        {view === "pipeline" && (
          <PipelineView
            advisors={advisors}
            filtered={filtered}
            search={search} setSearch={setSearch}
            stageFilter={stageFilter} setStage={setStage}
            catFilter={catFilter} setCat={setCat}
            statusFilter={statusFilter} setSF={setSF}
            assigneeFilter={assigneeFilter} setAF={setAF}
            onOpen={setOpenId}
          />
        )}

        {view === "tracker" && (
          <TrackerView
            advisors={advisors}
            filtered={filtered}
            search={search} setSearch={setSearch}
            assigneeFilter={assigneeFilter} setAF={setAF}
            statusFilter={statusFilter} setSF={setSF}
            onOpen={setOpenId}
            updateTracker={updateTracker}
          />
        )}

        {view === "alerts" && (
          <AlertsView advisors={advisors} onOpen={setOpenId} updateTracker={updateTracker} />
        )}
      </div>

      {openAdvisor && (
        <DetailModal
          advisor={openAdvisor}
          onClose={() => setOpenId(null)}
          updateTracker={updateTracker}
        />
      )}
    </div>
  );
}

// ---------- top bar ----------

function TopBar({ stats, onExport, view, setView }) {
  const tabs = [
    { key: "dashboard", label: "Dashboard" },

}

function AlertsView({ advisors, onOpen, updateTracker }) {
  const unassigned = advisors.filter(a => a.stage1.pass && !a.tracker.assignee && !["rejected","matched","on_hold"].includes(a.tracker.status));
  const stale = advisors.filter(a => a.idleDays >= STALE_DAYS && !["approved","rejected","matched","on_hold"].includes(a.tracker.status));
  const awaitingAck = advisors.filter(a => !a.tracker.receivedAck && a.tracker.status === "new");

  return (
    <div className="space-y-6 fade_in">
      <div>
        <h1 className="text-3xl font-bold text-brand-dark">Alerts</h1>
        <p className="text-[#6B706E] mt-1">Applications that need an owner, a reply, or a nudge. Clear these first so nobody slips through.</p>
      </div>

      <AlertBlock
        title="Awaiting acknowledgement"
        blurb="New submissions that have not yet been acknowledged. Reply within 48 hours of application."
        advisors={awaitingAck}
        color="#309DC4"
        action={(a) => updateTracker(a.id, { receivedAck: true, status: "acknowledged" }, "Acknowledgement sent")}
        actionLabel="Mark acknowledged"
        onOpen={onOpen}
      />

      <AlertBlock
        title="Qualified but unassigned"
        blurb="Advisors who cleared Stage 1 and need an owner on the Elevate team."
        advisors={unassigned}
        color="#DE6336"
        customControl={(a) => (
          <select
            onChange={e => e.target.value && updateTracker(a.id, { assignee: e.target.value, status: a.tracker.status === "new" ? "allocated" : a.tracker.status }, `Assigned to ${e.target.value}`)}
            defaultValue=""
            className="py-1.5 px-2 rounded border border-surface-border bg-white text-[12px] font-semibold">
            <option value="">Assign to...</option>
            {TEAM.map(n => <option key={n} value={n}>{n}</option>)}
          </select>
        )}
        onOpen={onOpen}
      />

      <AlertBlock
        title={`Idle over ${STALE_DAYS} days`}
        blurb="No status change in more than two weeks. Contact the advisor or close the file."
        advisors={stale}
        color="#B45309"
        action={(a) => updateTracker(a.id, {}, "Nudged, still active")}
        actionLabel="Log nudge"
        onOpen={onOpen}
      />
    </div>
  );
}

                <div className="section_title">Stage 1 · Elevate Fit</div>
                <div className="flex items-center gap-2">
                  <span className={`badge ${a.stage1.pass ? "ok_tag" : ""}`} style={!a.stage1.pass ? {background:"#F1F1EC",color:"#6B706E"} : {}}>
                    {a.stage1.pass ? "Qualified" : "Below threshold"}
                  </span>
                  <span className="tabular font-bold text-lg text-brand-dark">{a.stage1.total}<span className="text-[#6B706E] text-sm font-normal">/100</span></span>
                </div>
              </div>
              <div className="mt-3 grid grid-cols-2 gap-x-5 gap-y-2 text-sm">
                {Object.entries(parts).map(([k, v]) => (
                  <div key={k} className="flex items-center gap-3">
                    <div className="flex-1">
                      <div className="flex items-center justify-between">
                        <span className="text-brand-dark">{partLabels[k]}</span>
                        <span className="tabular text-[#6B706E]">{v}<span className="opacity-50">/{partMax[k]}</span></span>
                      </div>
                      <div className="progress_bar mt-1">
                        <div className="progress_fill" style={{width: (v/partMax[k]*100)+"%", background:"#DE6336"}} />
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </section>

            {/* Stage 2 */}
            <section>
              <div className="section_title mb-2">Stage 2 · C-Suite category fit</div>
              <div className="grid grid-cols-3 gap-3">
                {CATEGORIES.map(c => {
                  const score = a.stage2[c.key.toLowerCase()];
                  const isPrimary = c.key === a.stage2.primary;
                  const color = c.key === "CEO" ? "#DE6336" : c.key === "CTO" ? "#309DC4" : "#E78B3F";
                  return (
                    <div key={c.key} className={`p-3 rounded-lg border ${isPrimary ? "border-transparent" : "border-surface-border"}`}
                         style={isPrimary ? {background:color+"10",borderColor:color+"55"} : {}}>
                      <div className="flex items-center justify-between">
                        <div className="font-bold text-brand-dark text-sm">{c.label}</div>
                        {isPrimary && <span className="badge" style={{background:color,color:"#fff"}}>Primary</span>}
                      </div>
                      <div className="tabular font-bold text-2xl mt-1" style={{color: isPrimary ? color : "#1F3036"}}>{score}</div>
                      <div className="text-[11px] text-[#6B706E] mt-1">{c.blurb}</div>
                    </div>
                  );
                })}
              </div>
            </section>

            {/* Application details */}
            <section>
              <div className="section_title mb-2">Application details</div>
              <div className="space-y-3 text-sm">
                <Field label="Years of experience" value={a.years} />
                <Field label="Tech industry rating (1 to 5)" value={a.techRating} />
                <Field label="Palestinian ecosystem rating (1 to 5)" value={a.ecoRating} />
                <Field label="C-level management experience" value={a.cLevel} detail={a.cLevelDetail} />
                <Field label="Mentoring / coaching / advisory experience" value={a.expAreas} detail={a.expDetail} />
                <Field label="Non-technical subject expertise" value={a.nonTechSubjects} />
                <Field label="Technical specialisations" value={a.techSpecs} />
                <Field label="Wants to support in" value={a.supportIn} />
                <Field label="Supporting GSG through" value={a.supportVia} />
                <Field label="Interests in Palestinian talent" value={a.opportunities} />
                <Field label="Paid or volunteer" value={a.paidOrVol} detail={a.hourlyRate && `${a.hourlyRate} USD/hr`} />
                <Field label="Past GSG involvement" value={a.gsgPast} />
                <Field label="Heard about us via" value={a.heardFrom} />
                <Field label="Extra notes from applicant" value={a.notes} />
              </div>
            </section>
          </div>

          {/* Right: tracker controls */}
          <div className="p-6 bg-surface-soft space-y-5">
            <div>
              <div className="section_title">Pipeline tracker</div>
              <div className="text-brand-dark font-bold">Workflow state</div>
            </div>

            <div>
              <label className="text-[12px] text-[#6B706E] font-semibold">Status</label>
              <select value={t.status}
                onChange={e => setField("status", e.target.value, `Status set to ${STATUS_MAP[e.target.value]?.label || e.target.value}`)}
                className="mt-1 w-full py-2 px-3 rounded-lg border border-surface-border bg-white text-sm font-semibold focus_ring">
                {STATUSES.map(s => <option key={s.key} value={s.key}>{s.label}</option>)}
              </select>
            </div>

            <div>
              <label className="text-[12px] text-[#6B706E] font-semibold">Assigned to</label>
              <select value={t.assignee}
                onChange={e => setField("assignee", e.target.value, `Assigned to ${e.target.value || "nobody"}`)}
                className="mt-1 w-full py-2 px-3 rounded-lg border border-surface-border bg-white text-sm font-semibold focus_ring">
                <option value="">Unassigned</option>
                {TEAM.map(n => <option key={n} value={n}>{n}</option>)}
              </select>
            </div>

            <label className="flex items-center gap-2 text-sm text-brand-dark font-semibold">
              <input type="checkbox" checked={t.receivedAck}
                     onChange={e => updateTracker(a.id, { receivedAck: e.target.checked, status: e.target.checked && t.status === "new" ? "acknowledged" : t.status }, e.target.checked ? "Acknowledgement sent" : "Acknowledgement unchecked")} />
              Acknowledgement sent to applicant
            </label>

            <div className="divider" />

            <div>
              <div className="section_title mb-2">Schedule</div>
              <div className="space-y-2.5">
                <DateField label="Intro call"    value={t.introScheduled} onChange={v => setField("introScheduled", v, v ? `Intro call set to ${v}` : "Intro date cleared")} />
                <DateField label="Assessment"    value={t.assessmentDate} onChange={v => setField("assessmentDate", v, v ? `Assessment set to ${v}` : "Assessment date cleared")} />
                <DateField label="Final decision" value={t.decisionDate}  onChange={v => setField("decisionDate",  v, v ? `Decision set to ${v}` : "Decision date cleared")} />
              </div>
            </div>

            <div className="divider" />

            <div>
              <div className="section_title mb-1">Notes</div>
              <textarea
                value={localNotes}
                onChange={e => setLocalNotes(e.target.value)}
                onBlur={() => { if (localNotes !== t.notes) updateTracker(a.id, { notes: localNotes }, "Notes updated"); }}
                placeholder="Internal notes, red flags, follow up reminders"
                rows={5}
                className="w-full py-2 px-3 rounded-lg border border-surface-border bg-white text-sm focus_ring" />
            </div>

            <div>
              <div className="section_title mb-2">History</div>
              <div className="max-h-48 overflow-y-auto scroll_slim space-y-1.5 text-[12px]">
                <div className="flex justify-between text-[#6B706E]">
                  <span>Application received</span>
                  <span className="tabular">{fmtDate(parseGoogleTs(a.timestamp))}</span>
                </div>
                {(t.history || []).slice().reverse().map((h, i) => (
                  <div key={i} className="flex justify-between text-[#6B706E]">
                    <span>{h.label}</span>
                    <span className="tabular">{fmtDate(h.at)}</span>
                  </div>
                ))}
                {(!t.history || t.history.length === 0) && <div className="text-[#6B706E] italic">No changes logged yet</div>}
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  );
}

function Field({ label, value, detail }) {
  if (!value && !detail) return null;
  return (
    <div>
      <div className="text-[11px] uppercase tracking-wider text-[#6B706E] font-semibold">{label}</div>
      <div className="text-brand-dark mt-0.5 whitespace-pre-wrap">{value || ""}</div>
      {detail && <div className="text-[12px] text-[#6B706E] mt-0.5">{detail}</div>}
    </div>
  );
}

function DateField({ label, value, onChange }) {
  return (
    <div className="flex items-center justify-between gap-2">
      <label className="text-sm text-brand-dark">{label}</label>
      <input type="date" value={value || ""} onChange={e => onChange(e.target.value)}
             className="py-1.5 px-2 rounded border border-surface-border bg-white text-[13px] tabular focus_ring" />
    </div>
  );
}

// ---------- mount ----------
ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>

</body>
</html>
